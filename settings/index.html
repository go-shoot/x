<title>設定</title>
<script defer src=../include/common.js></script>
<link rel=stylesheet href=../parts/part.css>
<style>
    main {
        max-width: min(100% - 1em,25em);

        p,form {text-align: left;}
        x-part {margin: 1em 0;}
        .toggle {font-size: .8em;}
        hr {margin-top: 2em;}
    }
    fieldset {
        margin-top: 2em;
        legend {margin-bottom: 1em; padding: 0;}
    }
    dl {
        display: grid; grid-template-columns: max-content 1fr 1fr 1fr; gap: .5em;
        dt {align-self: end;}
        dd {display: contents; &>* {width: 100%;}}
    }
    select,input {
        background: none; border-radius: 0; border: none; outline: none !important;
        border-bottom: .1em solid var(--theme);
        color: var(--on); font-size: .9em;

        &:open {border-color: var(--accent);}
        option {background: var(--overlay);}
    }
    form:last-of-type,form:first-of-type {
        gap: .5em;
        margin-top: 1em;
        font-weight: 500;

        &,fieldset {display: flex; align-items: center;}
        fieldset {
            font-weight: normal; gap: .25em;
            margin: 0;
    
            &:has([name=bottom]) {flex-direction: column;}
        }
        .toggle::before {line-height: 1.5;}
    }
</style>

<nav><menu></menu></nav>
<main>
    <p>在本站，先按住「部件磚」或「陀螺列」再拖至角落能進行社交媒體或購物網站搜索。立即試試：（在iOS可能不暢順）</p>
    <form>
        彈出式<label class="toggle"><input type="checkbox" name="drop-popup" checked="true"></label>
    </form>
    <form>
        <fieldset><legend>部件磚</legend><dl id="tile"></dl></fieldset>
        <fieldset><legend>陀螺列</legend><dl id="row"></dl></fieldset>
    </form>
    <hr>
    <form>
        <fieldset><legend>部件頁首頁</legend><select></select></fieldset>
    </form>
    <form id="reboot">
        功能列
        <fieldset>上<label class="toggle bilateral vertical"><input type="checkbox" name="bottom"></label>下</fieldset>
        ｜
        <fieldset>左<label class="toggle bilateral"><input type="checkbox" name="right"></label>右</fieldset>
        連結
    </form>
</main>

<script type="module">
import DB from '../include/DB.js';
import {Bey, Search} from '../parts/bey.js';
Q('main').prepend(DB().then(async () => {
    let forms = document.forms;
    let PARTS = await DB.get.essentials();
    let [tile, {beys}] = await Promise.all([PARTS.blade.HlNt.tile(), new Search('CX-13')]);
    forms[0].before(tile, E('table>tbody', beys.map(bey => new Bey(bey).Row)));
    Q('.toggle input').forEach(input => input.checked = Storage('pref')?.[input.name] ?? input.checked);

    forms[0].onchange = ev => {
        Storage('pref', {'drop-popup': ev.target.checked});
        Q('a[id|=drop]', a => a.target = ev.target.checked ? '_blank' : '');
    }

    let chi = {tl: '左上', tr: '右上', bl: '左下', br: '右下'};
    Q('dl', dl => dl.append(...['tl','tr','bl','br'].flatMap(n => [
        E('dt', chi[n]), 
        E('dd', [
            E('select', {name: `${dl.id}-${n}-site`}, 
                Object.keys(DropSearch.zone.href).map(p => E('option', {value: p}, p))),
            E('select', {name: `${dl.id}-${n}-locale`}, 
                Object.entries(DropSearch.zone.text).map(([v, t]) => E('option', {value: v}, t))),
            E('input', {name: `${dl.id}-${n}-append`, placeholder: '外加關鍵字'})
        ])
    ])));
    let config = new O(Storage('drop-search') || DropSearch.default);
    [...config.reshape(keys => [keys.join('-')])].forEach(([n, v]) => forms[1][n] && (forms[1][n].value = v));
    forms[1].onchange = ev => Storage('drop-search', {...new O(new FormData(forms[1])).reshape(([k]) => k.split('-'))});

    fetch('../sitemap.txt').then(resp => resp.text()).then(text => {
        let pref = Storage('pref')?.parts ?? '?blade';
        forms[2].Q('select').append(...text.split('\n').filter(url => url.includes('parts')).map(url => {
            url = new URL(url);
            url = url.search + url.hash;
            return E('option', url, {selected: pref == url});
        }));
    });
    forms[2].onchange = ev => {
        Storage('pref', {parts: ev.target.value});
        Q('a[href*="/parts/"]', a => a.href = '/x/parts/' + ev.target.value);
    }

    forms[3].onchange = ev => {
        Storage('pref', {[ev.target.name]: ev.target.checked});
        ev.target.name == 'bottom' && Menu.nav.classList.toggle('bottom', ev.target.checked);
        ev.target.name == 'right' && Menu.nav.classList.toggle('right', ev.target.checked);
    }
}));
</script>
