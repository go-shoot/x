<title>陀螺3D模型</title>
<script defer src=../include/common.js></script>
<script src="https://aeoq.github.io/drag-knob.mjs" type="module"></script>
<link rel="stylesheet" href="../index.css">
<style>
    input::placeholder,drag-knob,nav :is(input,label,button,span) {font-size: .8em;}
    nav {
        button {
            place-self: center end;
            min-width: 4rem; height: 1.4rem;
        }
        #reset {grid-area: 1/3;}
        #share {grid-area: 2/3;}
        #delete {grid-area: 1/4;}
        #save {grid-area: 2/4;}
        fieldset {grid-area: 1/3/3/4; place-self: center start;}
        span {grid-area: 1/2; place-self: end center;}
        .toggle {grid-area: 2/2; place-self: center;}
    }
    #search {
        opacity: 1 !important;
        justify-content: start; align-items: center; gap: .2rem .4rem;
        user-select: none; -webkit-user-select: none;

        >:first-child,dl,label:has([value="0"]) {margin-left: .2rem;}
        >:not(search) {font-size: .9em;}
        input[type=color] {background: var(--on);}
        search {margin: 0 .2rem;}
        #random,label:has(input[name=bey]) {
            padding: 0 .5em;
            background: var(--theme); border-radius: 3em; 
            color: var(--backdrop);
        }
        .assembled:not(:empty)::before {content: '已組裝：';}
        .assembled label::after {
            content: '';
            background: url(/x/img/mode.png) center / contain;
            display: inline-block; height: 1.4em; width: 1.4em;
            vertical-align: -.35em; margin-left: .3em;
        }
        ol:empty,dl:has(output:empty) {display: none;}
        dl {
            display: flex; gap: .3em;
            mask-image: linear-gradient(to right,black 95%,transparent); padding-right: 1rem;
        }
        dt {
            min-width: 2em;
            line-height: 1.1;
        }
        dt:nth-of-type(n+2):not(:last-of-type) {min-width: 4em;}
        dd {margin-right: .5em;}
        output {font-size: 2em; color: var(--on);}
    }
    #canvas {
        position: fixed; width: max(100svh,100svw); max-width: none; aspect-ratio: 1;
        left: 50svw; top: 50svh; transform: translate(-50%,-50%);
        z-index: -1;
        margin: 0 auto;
        @media (orientation: landscape) {margin-top: 4em;}

        canvas {width: 100%; height: 100%; pointer-events: auto;}
    }
    #models {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        transition: transform .25s;

        figure {margin-bottom: .5em;}
        &:not(:has(code:not(:empty))) {transform: translateX(-50%) translateY(calc(.5em + 100%));}
    }
    h1 {max-width: calc(100% - 5.8em); white-space: nowrap;}
    small {
        margin-left: auto;
        width: 10em;
        font-size: .7em !important; line-height: 1.1; color: gray;
    }
</style>

<nav>
    <menu></menu>
    <form>
        <button type="button" id="save">&#xe006; 保存兩顆</button>
        <button type="button" id="delete">&#xe008; 刪除兩顆</button>
        <button type="button" id="share">&#xe038; 連結</button>
        <button type="button" id="reset"> 重設</button>
        <span>展開</span>
        <label class="toggle"><input type="checkbox"></label>
        <fieldset>
            <drag-knob name="speed" range="-.5/.5/.01"><i>轉速</i></drag-knob>
            <drag-knob name="rotation" range="-180/180/1/°" class="fine" style="display: none;"><i>角度</i></drag-knob>
        </fieldset>
    </form>
</nav>
<main>
    <section id="search">
        <span>選擇配色：</span><input type="color"><input type="color">
        <button id="random">&#xe02f; 隨機組裝</button><span>或</span>
        <search><input type="search" placeholder="搜索部件：請由底（軸心）開始往上組裝"></search>
        <ol class="preview"></ol>
        <ol class="assembled"></ol>
        <dl>
            <dt>全高<dd><output></output>
            <dt>金屬零件重心高度<dd><output></output>
            <dt>金屬零件偏重心度<dd><output></output>
            <dt>金屬零件外重心度<dd><output></output>
            <dt>重量<dd><output></output>
        </dl>
        <label><input type="radio" name="bey" value="0" checked>#1</label>
        <label><input type="radio" name="bey" value="1">#2</label>
        <h1></h1>
        <small>重量外數值以模型計算，與實物或有不同</small>
    </section>
    <section id="canvas"></section>
    <div id="models"><figure><canvas></canvas></figure></div>
</main>
<!-- 
find ./ -type f \( -iname "*.glb" -o -iname "*.gltf" \) -print0 | while IFS= read -r -d '' file; do gltf-transform optimize "$file" "$file" --compress draco --texture-compress webp; done
-->
<script type="module">
import DB from '../include/DB.js';
import IndexSearch from '../index.js';
import { Bey, Search } from '../parts/bey.js';
import Model from './model.js';
import PI from 'https://aeoq.github.io/pointer-interaction.mjs';
import * as THREE from 'three/webgpu';

let MODEL, COLORS, PARTS;
Q('main').prepend(DB().then(() => DB.get.essentials({drop: false}).then(Ps => {
    PARTS = Ps;
    [...Ps.blade.values()].forEach(P => P.revise?.());
    App.load();
})));
const App = {
    comp: null,
    events () {
        PI.events({'.scroller,#search ol,dl': {scroll: {x: true}}, '#canvas canvas': {drag: PI => true}});
        Q('#random').onclick = App.events.randomize;
        Q('.preview').onclick = App.events.select.part;
        Q('.assembled').onclick = App.events.show.controls;
        Q('input[name=bey]', input => input.onchange = App.events.switch);
        Q('main').onclick = ev => ev.target.closest('#models,.assembled') || Q('canvas.PI-dragged') || App.close.controls();
        document.forms[0].oninput = App.events.adjust;
        document.forms[0].onclick = App.events.button;
    },
    async load (data) {
        let cache = Q('input[type=search]').onfocus();
        if (data) {
            history.replaceState(null, '', location.pathname);
            data = [new O(data)];
        } else {
            data = JSON.parse(new URLSearchParams(location.search).get('bey')) || await DB.get('user', 'assemble');
            data = [data].flat().filter(b => b).concat(...App.default).slice(0, 2).map(data => new O(data));
        }
        MODEL ? 
            await Promise.all(
                data[0].map(async ([comp, d]) => Object.assign(await MODEL.bey.replace(comp, d.code), d))
            ).then(() => MODEL.bey.assemble()) :
            await new Promise(res => {
                MODEL = new Model(data, {onIntersect: res, onAssemble: () => {
                    App.events.switch(Q('input[name=bey]:checked').value);
                    App.show.specs();
                }});
                Q('#canvas').append(MODEL.canvas);
            });
        cache.then(() => Promise.all(data.flatMap((parts, i) => {
            let selected = data.length > 1 ? MODEL.beys[i] : MODEL.bey;
            return parts.filter(([comp]) => selected[comp]).map(async ([comp, part]) => {
                let query = new Set([part.abbr]), path;
                selected[comp].li = 
                    IndexSearch.find.parts({[comp]: query, free: query}).find(li => {
                        path = li.firstChild.dataset.path?.split(',') ?? [];
                        return path.at(-1) == part.abbr && path.at(-2) == comp;
                    });
                selected[comp].li.dataset.colors = (await new Search(path)).beys.map(([code]) => code);
            }
        )}))).then(App.show.info);
    },
    serialize: bey => bey == null ? 
        MODEL.beys.map(App.serialize) : 
        {...new O(bey).map(([comp, {abbr, code, adjust}]) => [comp, {abbr, code, adjust}])},
    show: {
        info: () => {
            if (Object.keys({...MODEL.bey}).length === 0) return Q('#reset').click();
            let parts = {};
            new O(MODEL.bey).each(([comp, {abbr, li}]) => {
                Model.BeyAssembly.modes[comp]?.find(abbr) && !li.Q('input') && li.append(E('label>input', {type: 'checkbox'}));
                parts[comp] = PARTS.at(li.firstChild.dataset.path.split());
            });
            parts.blade ??= ['chip','main','over','metal','assist']
                .filter(c => MODEL.bey[c]).map(c => PARTS.at(MODEL.bey[c].li.firstChild.dataset.path.split()));
            Q('.assembled').replaceChildren(...new O(MODEL.bey).map(([, {li}]) => li));
            let {names: {chi, rest}, weight} = new Bey(parts);
            Q('h1').innerText = (chi?.join('') || '未命名') + rest;
            Q('dd:last-of-type output').value = weight;
        },
        knobs: () => App.comp == 'bit' || Q('drag-knob[name$=tion]', knob => {
            knob.style.display = 'inline-grid';
            knob.pauseEvent = true;
            knob.value = MODEL.bey[App.comp].adjust[knob.name] ?? 0;
            knob.pauseEvent = false;
        }),
        specs: () => MODEL.bey.specs.map((v, i) => Q('output')[i].value = Math.round(v * 100) / 100)
    },
    close: {controls () {
        let figure = Q('#models figure');
        figure.replaceChildren(figure.firstChild);
        figure.scrollLeft = 0;
        Q('drag-knob[name$=tion]', knob => knob.style.display = 'none');
    }},
    default: [{
        "blade": { "code": "JgCl", "abbr": "JgCl" },
        "bit": { "code": "CX09", "abbr": "TK" },
    }, {
        "main": {"abbr": "Fr","code": "CX12"},
        "assist": {"abbr": "J","code": "BXC14"},
        "chip": {"abbr": "Vl","code": "BXH14"},
        "bit": {"abbr": "I","code": "BXH-23"},
        "ratchet": {"abbr": "1-50","code": "CX-13"}
    }],
}
Object.assign(App.events, {
    switch (ev) {
        let index = typeof ev == 'object' ? ev.target.value : ev;
        MODEL.bey = MODEL.beys[index];
        MODEL._camera.position.x = MODEL._controls.target.x = index * 50;
        typeof ev == 'object' && (App.show.info(), App.show.specs());
    },
    redraw: () => Q('#reset').click(),
    async randomize () {
        let inputs = Q('input[type=color]', []), matched = {};
        inputs.every(i => i.value == '#000000') && (inputs[0].value = color.random());
        COLORS ??= new O(await fetch('/x-model/colors.json').then(resp => resp.json()));
        COLORS.each(([code, part]) => part.each(([part, colors]) => {
            let [comp, abbr] = part.split('.');
            Math.min(...inputs.filter(i => i.value != '#000000').map(i => 
                Math.min(...colors.map(c => c ? color.distance(i.value, c) : 0))
            )) < .15 && (matched[comp] ??= []).push([code, part]);
        }));
        let blades = [...matched.blade ?? [], ...matched.main ?? [], ...matched.over ?? []];
        if (!blades.length) return App.events.redraw();
        let [code, part] = blades[Math.floor(Math.random() * blades.length)];
        let [comp, abbr] = part.split('.');
        let drawn = {[comp]: {abbr: part.split('.')[1], code}};
        let others = {blade: [], main: ['assist', 'chip'], over: ['assist', 'metal', 'chip']};
        for (let c of [...others[comp], 'ratchet', 'bit']) {
            if (!matched[c]) return App.events.redraw();
            let [code, part] = matched[c][Math.floor(Math.random() * matched[c].length)];
            drawn[c] = {abbr: part.split('.')[1], code};
        };
        App.load(drawn);
    },
    select: {
        async part (ev) {
            if (ev.target.tagName != 'BUTTON') return;
            let path = ev.target.dataset.path.split(',');
            let [abbr, comp] = path.toReversed(), code, model;
            comp == 'hasbro' && (comp = {I: 'over', En: 'chip'}[abbr]);
            let colors = (await new Search(path)).beys.map(([code]) => code);
            for (code of colors) {
                model = await MODEL.fetch(code, {comp});
                if (model) break;
            }
            if (!model) return;
            Q('input[type=search]').value = '';
            App.comp = comp;
            Object.assign(await MODEL.bey.replace(comp, model), {
                abbr, code, li: E(ev.target.closest('li').cloneNode(true)).set({dataset: {colors}})
            });
            MODEL.bey.assemble();
            App.show.info();
            gtag('event', 'ASSEMBLE', {PART: abbr});
        },
        async color (code) {
            MODEL.bey[App.comp].model = await MODEL.fetch(code, {comp: App.comp});
            MODEL.bey[App.comp].code = code;
            MODEL.bey.assemble();
        }
    },
    show: {controls (ev) {
        let li = ev.target.closest('li');
        let [abbr, comp] = li.firstChild.dataset.path.split(',').reverse();
        if (ev.target.type == 'checkbox')
            return MODEL.bey[comp].adjust = {...MODEL.bey[comp].adjust, mode: ev.target.checked, abbr};
        if (ev.target.tagName != 'BUTTON') return;
        App.comp = comp;
        App.close.controls();
        App.show.knobs();
        setTimeout(() => new Model({[comp]: li.dataset.colors.split(',')}, {onclick: App.events.select.color}), 250); //wait until closed
    }},
    adjust (ev) {
        if (ev.target.name == 'speed') return MODEL.speed = -ev.target.value;
        if (ev.target.type == 'checkbox') return MODEL.open = !MODEL.open;
        MODEL.bey[App.comp].adjust = {...MODEL.bey[App.comp].adjust, [ev.target.name]: ev.target.value};
        App.show.specs();
    },
    share: () => MODEL.bey.bit && navigator.clipboard.writeText(`${location.origin}${location.pathname}?bey=${encodeURIComponent(JSON.stringify(App.serialize(MODEL.bey)))}`),
    save: () => DB.put('user', {assemble: App.serialize()}),
    delete: () => DB.prepare.os('user', 'rw').delete('assemble'),
    button (ev) {
        if (ev.target.id == 'reset') {
            history.replaceState(null, '', location.pathname);
            Object.values(MODEL.bey).forEach(part => part.remove());
            Q('input[type=color],.assembled,h1,output', node => node.value = node.innerHTML = '');
            return ev.isTrusted || App.events.randomize();
        }
        if (ev.target.type == 'button')
            Promise.try(App.events[ev.target.id]).then(() => {
                let original = ev.target.innerText;
                ev.target.innerText = '';
                setTimeout(() => ev.target.innerText = original, 1000);
            });
    }
});
App.events();

const color = {
    random: () => {
        let [h, s, l] = [Math.random() * 360, Math.random() / 4 + .75, Math.random() / 4 + .375];
        let a = s * Math.min(l, 1 - l);
        const k = n => (n + h / 30) % 12, f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
        const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
        return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    },
    distance: (...colors) => {
        const M1 = new THREE.Matrix3().set(
            0.4122214708, 0.5363325363, 0.0514459929,
            0.2119034982, 0.6806995451, 0.1073969566,
            0.0883024619, 0.2817188376, 0.6299787005
        );
        const M2 = new THREE.Matrix3().set(
            0.2104542553,  0.7936177850, -0.0040720468,
            1.9779984951, -2.4285922050,  0.4505937099,
            0.0259040371,  0.7827717662, -0.8086757993
        );
        colors = colors.map(c => {
            c = new THREE.Color(c).convertSRGBToLinear();
            const v = new THREE.Vector3(c.r, c.g, c.b);
            v.applyMatrix3(M1);
            v.set(Math.cbrt(v.x), Math.cbrt(v.y), Math.cbrt(v.z));
            v.applyMatrix3(M2);
            return {L: v.x, C: Math.hypot(v.y, v.z), h: Math.atan2(v.z, v.y)};
        });
        const delta = new O(colors[0]).minus(colors[1]);
        delta.h = 2 * Math.sqrt(colors[0].C * colors[1].C) * Math.sin(Math.atan2(Math.sin(delta.h), Math.cos(delta.h)) / 2);
        return Math.sqrt(
            Math.pow(0 * delta.L, 2) +
            Math.pow(1 * delta.C, 2) +
            Math.pow(2 * delta.h, 2)
        );
    }
}
</script>
