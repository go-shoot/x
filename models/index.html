<title>陀螺3D模型</title>
<script defer src=../include/common.js></script>
<script src="https://aeoq.github.io/drag-knob.mjs" type="module"></script>
<link rel="stylesheet" href="../index.css">
<style>
    input::placeholder,drag-knob {font-size: .8em;}
    nav {
        input[type=reset],button {
            grid-area: 2/4; place-self: center;
            font-size: .8em;
            width: 7rem; height: 1.4rem;
            border: none;
            background: var(--theme); border-radius: 3em; 
            color: var(--backdrop);
        }
        button {grid-area: 1/4;}
        fieldset {white-space: nowrap;}
        fieldset:last-child {
            grid-area: 2/3; place-self: start;
            font-size: .8em; color: var(--on);
        }
    }
    #search {
        opacity: 1 !important;
        justify-content: start; gap: 0 .5em;
        user-select: none; -webkit-user-select: none;

        >:first-child,ol:last-of-type+* {padding-left: .2rem;}
        >:not(search) {font-size: .9em;}
        input[type=color] {background: var(--on);}
        #random {
            padding: 0 .5em;
            background: var(--theme); border-radius: 3em; 
            color: var(--backdrop);
        }
        .assembled:not(:empty)::before {content: '已組裝：';}
        dl {
            display: flex; gap: .5em;
            margin-top: .2em;
        } 
        dt {
            max-width: 4em;
            line-height: 1.1;
        }
        output {
            font-size: 2em; color: var(--on);
        }
    }
    #canvas {
        position: fixed; width: max(100svh,100svw); max-width: none; aspect-ratio: 1;
        left: 50svw; top: 50svh; transform: translate(-50%,-50%);
        z-index: -1;
        margin: 0 auto;
        @media (orientation: landscape) {margin-top: 4em;}

        canvas {width: 100%; height: 100%; pointer-events: auto;}
    }
    #models {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        transition: transform .25s;

        figure {margin-bottom: .5em;}
        &:not(:has(code:not(:empty))) {transform: translateX(-50%) translateY(calc(.5em + 100%));}
    }
</style>

<nav>
    <menu></menu>
    <form>
        <button type="button">&#xe008; 刪除儲存</button>
        <input type="reset" value=" 重設">
        <fieldset>
            <drag-knob name="speed" range="-.5/.5/.01"><i>轉速</i></drag-knob>
            <drag-knob name="rotation" range="-1/1/.005/π" class="fine" style="display: none;"><i>角度</i></drag-knob>
        </fieldset>
        <fieldset>
            展開
            <label class="toggle"><input type="checkbox"></label>
        </fieldset>
    </form>
</nav>
<main>
    <section id="search">
        <span>選擇配色：</span><input type="color"><input type="color">
        <button id="random">&#xe02f; 隨機組裝</button><span>或</span>
        <search><input type="search" placeholder="搜索部件：請由底（軸心）開始往上組裝"></search>
        <ol class="preview"></ol>
        <ol class="assembled"></ol>
        <dl><dt>全高<dd><output></output><dt>金屬部件重心高度<dd><output></output><dt hidden>金屬部件偏重心度<dd hidden><output></output></dl>
    </section>
    <section id="canvas"></section>
    <div id="models"><figure><canvas></canvas></figure></div>
</main>
<!-- 
find ./ -type f \( -iname "*.glb" -o -iname "*.gltf" \) -print0 | while IFS= read -r -d '' file; do gltf-transform optimize "$file" "$file" --compress draco --texture-compress webp; done
-->
<script type="module">
import DB from '../include/DB.js';
import IndexSearch from '../index.js';
import { Bey, Search } from '../parts/bey.js';
import Model from './model.js';
import PI from 'https://aeoq.github.io/pointer-interaction.mjs';

let MODEL, COLORS, PARTS;
Q('main').prepend(DB().then(() => DB.get.essentials().then(Ps => (PARTS = Ps) && App.load())));

const App = {
    data: [new O({})], comp: null,
    events () {
        PI.events({'.scroller,#search ol': {scroll: {x: true}}});
        Q('#random').onclick = App.events.randomize;
        Q('.preview').onclick = App.events.show.model;
        Q('.assembled').onclick = App.events.show.controls;
        Q('main').onclick = ev => ev.target.closest('#models,.assembled') || App.close.controls();
        document.forms[0].oninput = App.events.adjust;
        document.forms[0].onclick = App.events.reset;
    },
    async load (data) {
        let cache = Q('input[type=search]').onfocus();
        App.data = (data ?? await DB.get('user', 'assemble') ?? App.model.default).map(data => new O(data));
        App.data[0].each(([_, data]) => data.adjust ??= {rotation: null});
        if (!MODEL) {
            MODEL = new Model(
                App.data[0].map(([comp, {code, abbr}]) => [comp, code ?? abbr]), null, {
                    adjust: App.data[0].map(([comp, {adjust}]) => [comp, adjust]),
                    intersect: () => App.show.specs()
                }
            );
            Q('#canvas').append(MODEL.canvas);
        } else
            App.data[0].each(async ([comp, {code}]) => App.model.switch(await MODEL.fetch(code, comp), comp));
        await cache;
        App.data[0].each(async ([comp, data]) => {
            let path;
            data.li = IndexSearch.find.parts({[comp]: new Set([data.abbr]), free: new Set([data.abbr])})
                .find(li => {
                    path = li.firstChild.dataset.path?.split(',') ?? [];
                    return path.at(-1) == data.abbr && path.at(-2) == comp;
                });
            data.colors = (await new Search(path)).beys.map(([code]) => code);
        });
        App.show.menu();
    },
    save: () => DB.put('user', {assemble: App.data.map(data => 
        ({...data.filter(([_, d]) => d).map(([comp, {li, colors, ...rest}]) => [comp, rest])})
    )}),
    show: {
        menu: () => Q('.assembled').replaceChildren(...App.data[0].filter(([_, d]) => d).map(([comp, {li}]) => li)),
        knobs: () => App.comp == 'bit' || Q('drag-knob[name$=tion]', knob => {
            knob.style.display = 'inline-grid';
            knob.value = App.data[0][App.comp].adjust[knob.name] ?? 0;
        }),
        specs: () => ['$height', '$metalHeight', '$metalCenter'].map((p, i) => Q('output')[i].value = Math.round(MODEL.group[p] * 100) / 100)
    },
    close: {controls () {
        let figure = Q('#models figure');
        figure.replaceChildren(figure.firstChild);
        figure.scrollLeft = 0;
        Q('drag-knob[name$=tion]', knob => knob.style.display = 'none');
    }},
    model: {
        remove (comp) {
            MODEL.bey.replace(comp);
            App.data[0][comp] = null;
        },
        async switch (model, comp = App.comp) {
            Q('output', o => o.value = '');
            if (typeof model == 'string') {
                App.data[0][comp].code = model;
                model = await MODEL.fetch(model, comp);
            };
            if (!model.$comp) return;
            let fused = comp => PARTS[comp][App.data[0][comp]?.abbr]?.attr?.has('fused');
            if (comp == 'blade') {
                App.meta.CX.forEach(App.model.remove);
                if (fused('blade')) {
                    App.model.remove('ratchet');
                    fused('bit') && App.model.remove('bit');
                }
            } else if (App.meta.CX.has(comp)) {
                App.model.remove('blade');
                comp == 'main' ? App.meta.CXX.forEach(App.model.remove) : App.meta.CXX.has(comp) && App.model.remove('main');
            } else if (comp == 'bit' && fused('bit')) {
                App.model.remove('ratchet');
                fused('blade') && App.model.remove('blade');
            } else if (comp == 'ratchet') {
                ['blade', 'bit'].forEach(comp => fused(comp) && App.model.remove(comp));
            }
            App.data[0][comp].adjust = {rotation: null};
            MODEL.bey.replace(comp, model);
            MODEL.bey.adjust(App.data[0].map(([comp, data]) => [comp, data?.adjust ?? {}]));
            App.show.specs();
            App.show.menu();
            App.data[0].bit?.abbr && App.save();
        },
        default: [{
            "blade":  {"code":"JgCl","abbr":"JgCl"},
            "bit":    {"code":"BX13","abbr":"HN"},
        }],
    },
    meta: {}
}
Object.assign(App.events, {
    async randomize () {
        let inputs = Q('input[type=color]', []), matched = {};
        inputs.every(i => i.value == '#000000') && (inputs[0].value = randomColor());
        COLORS ??= new O(await fetch('/x-model/colors.json').then(resp => resp.json()));
        COLORS.each(([code, part]) => part.each(([part, colors]) => {
            let [comp, abbr] = part.split('.');
            Math.min(...inputs.filter(i => i.value != '#000000').map(i => 
                Math.min(...colors.map(c => c ? Model.compute.colorDistance(i.value, c) : 0))
            )) < .15 && (matched[comp] ??= []).push([code, part]);
        }));
        if (!matched.ratchet || !matched.bit) return Q('input[type=reset]').click();
        let blades = [...matched.blade ?? [], ...matched.main ?? [], ...matched.over ?? []];
        let [code, part] = blades[Math.floor(Math.random() * blades.length)];
        let [comp, abbr] = part.split('.');
        if (comp != 'blade' && !matched.assist) return Q('input[type=reset]').click();
        let drawn = {[comp]: {abbr: part.split('.')[1], code}};
        let others = {blade: [], main: ['assist', 'chip'], over: ['assist', 'metal', 'chip']};
        [...others[comp], 'ratchet', 'bit'].forEach(comp => {
            let [code, part] = matched[comp][Math.floor(Math.random() * matched[comp].length)];
            drawn[comp] = {abbr: part.split('.')[1], code};
        });
        App.load([drawn]);
    },
    show: {
        async model (ev) {
            if (ev.target.tagName != 'BUTTON') return;
            let path = ev.target.dataset.path.split(',');
            let [abbr, comp] = path.toReversed(), code, model;
            comp == 'hasbro' && (comp = {I: 'over', En: 'chip'}[abbr]);
            App.data[0][comp] = new O({
                abbr, colors: (await new Search(path)).beys.map(([code]) => code), 
                li: ev.target.cloneNode(true), adjust: {rotation: null}
            });
            if (App.data[0][comp].colors.length) 
                for (code of App.data[0][comp].colors) {
                    model = await MODEL.fetch(code, comp);
                    if (model.$height) break;
                }
            else
                model = await MODEL.fetch(abbr, comp)
            code && (App.data[0][comp].code = code);
            App.comp = comp;
            App.model.switch(model);
            Q('input[type=search]').value = '';
            gtag('event', 'ASSEMBLE', {PART: abbr});
        },
        controls (ev) {
            if (ev.target.tagName != 'BUTTON') return;
            App.close.controls();
            let comp = App.comp = ev.target.dataset.path.split(',').at(-2);
            App.show.knobs();
            setTimeout(() => new Model({[comp]: App.data[0][comp].colors}, Q('#models canvas'), {onclick: App.model.switch}), 250); //wait until closed
        }
    },
    adjust (ev) {
        if (ev.target.name == 'speed') return MODEL.speed = -ev.target.value;
        if (ev.target.type == 'checkbox')
            return (MODEL.open = !MODEL.open) || setTimeout(() => {
                MODEL.bey.calculate(); 
                App.show.specs();
            }, 1000);
        if (!App.data[0][App.comp]) return;
        App.data[0][App.comp].adjust[ev.target.name] = ev.target.value;
        MODEL.bey.adjust(App.data[0].map(([comp, data]) => [comp, data?.adjust ?? {}]));
        App.show.specs();
        clearTimeout(App.saveTimer);
        App.saveTimer = setTimeout(App.save, 1000);
    },
    reset (ev) {
        if (ev.target.type == 'button')
            return DB.prepare.os('user', 'rw').delete('assemble');
        if (ev.target.type == 'reset') {
            [...App.meta.CX, 'blade', 'ratchet', 'bit'].forEach(App.model.remove);
            Q('.assembled').replaceChildren();
            Q('input[type=color]', input => input.value = '');
            ev.isTrusted || App.events.randomize();
        }
    }
});
App.meta.CXX = new Set(['over', 'metal']);
App.meta.CX = new Set(['chip', ...App.meta.CXX, 'main', 'assist']);
App.events();

const randomColor = () => {
    let [h, s, l] = [Math.random() * 360, Math.random() / 4 + .75, Math.random() / 4 + .375];
    let a = s * Math.min(l, 1 - l);
    const k = n => (n + h / 30) % 12, f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
</script>
